<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">kanban</div>
      <div class="boards">ALL BOARDS (1)</div>
      <div class="board-item">Launch Career</div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="header">Launch Career</div>

      <section class="kanban">
        <!-- TODO -->
        <div class="column">
          <div class="column-header">
            <span class="dot todo"></span>
            TODO (4)
          </div>
          <div class="cards">
            <div class="card">Launch Epic Career 🚀</div>
            <div class="card">Conquer React ⚛️</div>
            <div class="card">Understand Databases 🧠</div>
            <div class="card">Crush Frameworks 📚</div>
          </div>
        </div>

        <!-- DOING -->
        <div class="column">
          <div class="column-header">
            <span class="dot doing"></span>
            DOING (3)
          </div>
          <div class="cards">
            <div class="card">Master JavaScript 💛</div>
            <div class="card">Never Give Up 🏆</div>
            <div class="card">Stay Consistent 🔁</div>
          </div>
        </div>

        <!-- DONE -->
        <div class="column">
          <div class="column-header">
            <span class="dot done"></span>
            DONE (3)
          </div>
          <div class="cards">
            <div class="card">Explore ES6 Features 🚀</div>
            <div class="card">Have Fun 😄</div>
            <div class="card">Keep Learning 🎯</div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
